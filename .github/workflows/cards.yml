name: Profile cards

# No push trigger on purpose: the job commits to main and would loop.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Note: the default GITHUB_TOKEN only sees PUBLIC contributions.
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F login=${{ github.repository_owner }} -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection { contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                } }
              }
            }' | jq -c '.data.user.contributionsCollection.contributionCalendar' > data/contributions.json
      - run: python scripts/render_readme_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(cards): refresh profile cards"
          git push
